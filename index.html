<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22312C">
<title>amal-lia · курс лечения</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>💊</text></svg>">
<style>
:root{--paper:#FAF9F5;--ink:#22312C;--muted:#6C7A74;--rule:#E4E3DA;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.45;
  min-height:100svh;display:flex;align-items:center;justify-content:center;
  padding:24px 16px calc(24px + env(safe-area-inset-bottom))}
a{text-decoration:none;color:inherit}
a:focus-visible{outline:2px solid #2A4E96;outline-offset:3px;border-radius:18px}
.box{width:100%;max-width:420px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);display:flex;align-items:center;gap:8px;justify-content:center}
.eyebrow::before,.eyebrow::after{content:"";flex:1;height:1px;background:var(--rule)}
h1{text-align:center;font-size:28px;font-weight:800;letter-spacing:-.01em;margin:10px 0 4px}
.sub{text-align:center;font-size:13px;color:var(--muted);margin-bottom:26px}
.card{display:flex;align-items:center;gap:14px;border-radius:18px;padding:18px 18px;margin-bottom:12px;
  color:#fff;box-shadow:0 6px 16px rgba(34,49,44,.14);transition:transform .12s}
.card:active{transform:scale(.985)}
.card.amal{background:linear-gradient(150deg,#0A3D34,#11695A)}
.card.lia{background:linear-gradient(150deg,#152A52,#2B4E92)}
.card .cross{font-size:22px;flex:0 0 auto}
.card .nm{font-size:19px;font-weight:750}
.card .d{font-size:12.5px;opacity:.8;margin-top:2px;font-family:var(--mono)}
.card .arr{margin-left:auto;font-size:20px;opacity:.7}
footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:22px}
</style>
</head>
<body>
<div class="box">
  <div class="eyebrow">Horev Medical Center · Ташкент</div>
  <h1>Курс лечения</h1>
  <div class="sub">Выберите свой график приёма</div>
  <a class="card amal" href="/amal/">
    <span class="cross">✚</span>
    <span><span class="nm">Амал</span><br><span class="d">с 21.08 · 30 дней</span></span>
    <span class="arr">→</span>
  </a>
  <a class="card lia" href="/lia/">
    <span class="cross">✚</span>
    <span><span class="nm">Лия</span><br><span class="d">6 недель</span></span>
    <span class="arr">→</span>
  </a>
  <footer>Отметки сохраняются в браузере каждого устройства.</footer>
</div>
</body>
</html>
